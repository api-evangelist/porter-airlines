actions:
  openapiHarvested: false
  specsCount: 0
  apisListed: 0
  reason: >-
    Nothing machine-readable exists to harvest. apis.yml carries an empty apis[]
    array by design, which is the correct and expected shape for a carrier whose
    entire partner surface is a web sign-in plus a GDS relationship. The openapi/
    directory is deliberately absent rather than empty.
