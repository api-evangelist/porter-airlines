description: >-
  Porter Airlines is a Canadian carrier headquartered in Toronto, operating as
  Porter Airlines (Canada) Limited and Porter Airlines Inc. under IATA
  designator PD, IATA ticketing plate 451, and ICAO code POE. It is the
  challenger to the Air Canada / WestJet duopoly in Canada, flying an Embraer
  E195-E2 and De Havilland Dash 8 fleet across domestic, transborder and sun
  destinations, and it joined IATA as a member in 2026 following IOSA
  certification. Porter sits in the distribution chain as a conventional
  GDS-intermediated carrier: agencies reach its inventory through the GDSs
  (Sabre is named explicitly in Porter's agency terms, and Travelport is the
  channel Duffel uses to resell Porter content) or through Porter's own
  ticketless Travel Agency Portal on flyporter.com. Porter's API posture is
  honestly stated as none-published. There is no developer portal, no public or
  partner API documentation, no OpenAPI, and no NDC endpoint of any kind. The
  developer, developers and apis subdomains do not resolve; api.flyporter.com
  resolves but does not answer on 80 or 443; docs.flyporter.com redirects to an
  internal Google Drive. Every well-known spec path returns 404 and the whole
  site sits behind a Cloudflare bot challenge with ai-train=no content signals.
  Access is accreditation-gated: an agency must hold ARC accreditation or an
  IATA Passenger Sales Agency Agreement, register on flyporter.com, and accept
  Porter's Agency Terms and Conditions, which assert Porter ownership of all
  Porter Data, prohibit scraping and redistribution, and revoke all data rights
  the moment an appointment is suspended or terminated. There is no exit path
  beyond a written PIPEDA access request to Porter's Privacy Officer.
