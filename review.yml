aid: porter-airlines
name: Porter Airlines
review:
  question: >-
    Does Porter Airlines publish any public or partner API, and what would it
    cost a travel agency customer to leave Porter?
  answer: false
  date: '2026-07-28'
  reviewer: API Evangelist
  tier: airline
  homeMarket: Canada
  primaryDomain: flyporter.com
findings:
  summary: |
    Porter Airlines publishes no API of any kind. There is no developer portal,
    no partner API documentation, no OpenAPI or other machine-readable contract,
    and no NDC endpoint. The consumer surface is flyporter.com plus an iOS and
    Android app; the distribution surface is the GDSs plus a proprietary,
    human-only, ticketless Travel Agency Portal reached by web sign-in on
    flyporter.com. Every artifact a partner touches technically is somebody
    else's: Sabre and Travelport EDIFACT/JSON, ATPCO-filed fares, IATA BSP and
    ARC settlement. Porter itself ships nothing machine-readable.

    The commercial contract is where the switching cost lives. Porter's Agency
    Terms and Conditions (effective July 15, 2026) require ARC accreditation or
    an IATA Passenger Sales Agency Agreement, let Porter suspend or terminate an
    appointment immediately and at sole discretion, assert Porter ownership of
    all "Porter Data" including every PNR, prohibit scraping, bots, spiders and
    redistribution, impose an MFN clause on agency service fees, forbid bidding
    on Porter content through Kayak and Skyscanner, forbid membership in more
    than one travel association at a time, and cut off all data rights the
    instant an appointment is suspended or terminated.
  consumerSurface:
    documented: false
    note: >-
      Flight status, check-in, and the VIPorter loyalty programme are delivered
      through flyporter.com and the Porter Airlines mobile app only. No public
      consumer API is documented.
  distributionSurface:
    documented: false
    channels:
      - name: Global Distribution Systems
        evidence: >-
          Agency Terms and Conditions section 4.3.6 names the Sabre GDS
          explicitly ("The Agency shall not book Passive Segments through the
          Sabre GDS, but may book Passive Segments through any other GDS").
          Commission Policy lists "GDS (E-ticketed via BSP)" as a channel.
          Duffel states it accesses Porter (IATA PD) content through Travelport.
      - name: Porter Travel Agency Portal (ticketless)
        evidence: >-
          Named as a distinct channel in the Standard Commission Policy;
          reached only by human web sign-in at
          https://www.flyporter.com/en-ca/services/travel-agents/sign-in.
          No API, no documentation, no machine-readable contract.
      - name: NDC
        evidence: >-
          None found. NDC is not mentioned once in the Agency Terms and
          Conditions, Booking and Ticketing Policy, Standard Commission Policy,
          Name Change and Correction Policy, or any travel-agent page. No NDC
          certification for Porter was found in IATA material or trade press.
